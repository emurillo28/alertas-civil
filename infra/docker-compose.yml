version: '3.8'


services:
  localstack:
    image: localstack/localstack:3.4.0
    container_name: hc-alertas-localstack
    ports:
      - "4566:4566"
    environment:
      # Added sqs to the services list
      - SERVICES=dynamodb,s3,sqs
      - DEFAULT_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - "./localstack_data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      # Mount the initialization script to run on boot
      - "./scripts/bootstrap-local.sh:/etc/localstack/init/ready.d/bootstrap-local.sh"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
