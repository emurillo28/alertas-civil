name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  JAVA_VERSION: '25'
  QUARKUS_VERSION: '3.36.0'
  # MAVEN_OPTS override removed — so actions/setup-java cache: maven
  # correctly caches ~/.m2/repository instead of a throwaway /tmp path.

jobs:
  # ─── GATE 1 (parallel) ────────────────────────────────────────────────────────

  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Dependency Vulnerability Scan (OWASP)
        # No || true — CVSS ≥ 7 hard-fails the gate
        run: mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7 -Dformat=HTML -DoutputDirectory=dependency-check-report

      - name: Upload Dependency Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report/
          retention-days: 30

      - name: SpotBugs Static Analysis
        # No continue-on-error — high-severity bugs block the pipeline
        run: mvn com.github.spotbugs:spotbugs-maven-plugin:check -q

      - name: Checkstyle
        # No continue-on-error — style violations block the pipeline
        run: mvn checkstyle:check -q

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          # ~/.m2/settings.xml override removed — cache: maven manages the repo path

      - name: Run Unit Tests
        run: mvn test -DskipITs -q
        env:
          LOCALSTACK_AUTH_TOKEN: ""

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: target/surefire-reports/
          retention-days: 7

  integration-tests:
    name: Integration Tests (Testcontainers + LocalStack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run Integration Tests
        run: mvn verify -DskipUTs -Dtestcontainers.reuse.enable=false -q
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          TESTCONTAINERS_RYUK_DISABLED: "true"
          LOCALSTACK_AUTH_TOKEN: ""

      - name: Upload Integration Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: target/failsafe-reports/
          retention-days: 7

  # ─── GATE 2 (parallel, both need all 3 Gate 1 jobs) ─────────────────────────

  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [code-quality, unit-tests, integration-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.sha.outputs.short }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build JAR (Fast Jar)
        run: mvn package -DskipTests -q

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          # Immutable SHA tag only — :latest is never pushed
          tags: ghcr.io/${{ github.repository }}:${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [code-quality, unit-tests, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write      # Required for AWS OIDC AssumeRoleWithWebIdentity
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute Short SHA
        id: sha
        # Computed locally — same commit as docker-build, safe to run in parallel
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.x
          # No cli_config_credentials_token — backend is local state, auth via OIDC

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActionsPlan

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: infra/terraform
        run: terraform validate

      - name: Terraform Format Check
        working-directory: infra/terraform
        run: terraform fmt -check -diff

      - name: Terraform Plan
        id: plan
        working-directory: infra/terraform
        run: terraform plan -input=false -out=tfplan
        env:
          # SHA computed locally — no dependency on docker-build job output
          TF_VAR_image_tag: ${{ steps.sha.outputs.short }}

      - name: Upload tfplan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/terraform/tfplan
          retention-days: 1

  # ─── GATE 3: Manual Approval + Prod Deploy ───────────────────────────────────
  # The 'production' environment protection rule in GitHub Settings → Environments
  # enforces the required reviewer approval before this job starts.
  # Apply consumes the exact saved tfplan — zero drift between plan and apply.

  terraform-apply:
    name: Terraform Apply (Prod)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [docker-build, terraform-plan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.x

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActionsDeploy

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -input=false

      - name: Download tfplan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/terraform

      - name: Terraform Apply (saved plan — zero drift)
        working-directory: infra/terraform
        run: terraform apply -input=false tfplan

      - name: Notify Deploy Complete
        run: |
          echo "✅ Production deployment complete"
          echo "Image: ghcr.io/${{ github.repository }}:${{ needs.docker-build.outputs.image-tag }}"
          echo "API: https://$(terraform -chdir=infra/terraform output -raw api_endpoint)"
