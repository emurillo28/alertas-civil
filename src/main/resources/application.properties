# ─── 1. Propiedades Globales (Aplica a todos los entornos) ────────────────────
app.dynamodb.table-name=hc-alertas
app.s3.bucket-name=hc-alertas-clinical-docs
quarkus.dynamodb.client.connection-timeout=2s
quarkus.dynamodb.client.api-call-timeout=5s
app.sqs.notification-queue-url=${SQS_NOTIFICATION_QUEUE_URL:http://localhost:4566/000000000000/notification-queue}
# ─── 2. CORS Consolidado ──────────────────────────────────────────────────────
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# ─── 3. Configuración de Desarrollo (%dev) ───────────────────────────────────
%dev.quarkus.http.host=0.0.0.0
%dev.quarkus.dynamodb.devservices.enabled=true
%dev.quarkus.dynamodb.devservices.image-name=localstack/localstack:3.4.0
%dev.quarkus.dynamodb.devservices.container-env.SERVICES=dynamodb,s3,sqs
%dev.quarkus.log.level=DEBUG

# ─── 4. Configuración de Producción (%prod) ──────────────────────────────────
%prod.quarkus.dynamodb.devservices.enabled=false
%prod.quarkus.log.console.json=true
%prod.quarkus.log.level=INFO
%prod.quarkus.dynamodb.client.ssl.enabled=true