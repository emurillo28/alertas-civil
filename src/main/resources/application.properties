# Configuración de base de datos DynamoDB Single-Table
# (default local; prod sobreescribe vía Secrets Manager — ver %prod más abajo)
app.dynamodb.table-name=hc-alertas

# Afinación del Cliente AWS SDK v2
# Configura tiempos de espera agresivos y tolerantes para hilos virtuales de Loom,
# reduciendo el impacto de esperas lentas y cold starts.
quarkus.dynamodb.client.connection-timeout=2s
quarkus.dynamodb.client.api-call-timeout=5s

# Nombre del Handler de Lambda.
# QuarkusStreamHandler es el punto de entrada nativo correcto para AWS Lambda.
# Se usa el MISMO handler en ambas Lambdas (HTTP y SQS); la diferenciación se hace
# mediante la variable de entorno QUARKUS_LAMBDA_HANDLER (ver Terraform main.tf).
# - HTTP Lambda: sin QUARKUS_LAMBDA_HANDLER → Quarkus despacha a Vert.x/JAX-RS @Path
# - SQS Lambda: QUARKUS_LAMBDA_HANDLER=ingestLabSqsHandler → despacha a ese bean CDI
#quarkus.lambda.handler=io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler

# Evitar conflicto de puerto con el Mock Event Server de Lambda en dev/test
quarkus.lambda.mock-event-server.dev-port=8082
quarkus.lambda.mock-event-server.test-port=8083

# ─── Profile Defaults ────────────────────────────────────────────────────────
# Dev profile: mvn quarkus:dev (auto-starts LocalStack via Dev Services)
# Prod profile: mvn -Dquarkus.profile=prod package (uses real AWS endpoints)
# Test profile: mvn test (uses pinned LocalStack 3.4.0 via Testcontainers)

# ══════════════════════════════════════════════════════════════════════════════
# AWS Secrets Manager (solo activo en %prod)
# El nombre del secreto en AWS es: alertas-civil/<profile>
# Las keys dentro del JSON del secreto deben coincidir con los nombres aquí.
# Formato de resolución: ${<alias>:<json-key>:<default-if-missing>}
# ══════════════════════════════════════════════════════════════════════════════
%prod.quarkus.secretsmanager.secrets.alertas-config.secret-name=alertas-civil/${quarkus.profile}
%prod.app.dynamodb.table-name=${alertas-config:dynamodb_table_name:hc-alertas}
%prod.quarkus.s3.bucket-name=${alertas-config:s3_bucket_name:hc-alertas-clinical-docs}
%prod.app.jwt.signature-key=${alertas-config:jwt_signature_key:}
%prod.app.jwt.issuer=${alertas-config:jwt_issuer:alertas-civil-${quarkus.profile}}
%prod.app.jwt.ttl-seconds=${alertas-config:jwt_ttl_seconds:3600}

# ══════════════════════════════════════════════════════════════════════════════
# Local Development Profile (%dev) - Points to LocalStack
# ══════════════════════════════════════════════════════════════════════════════
%dev.quarkus.aws.region=us-east-1
%dev.quarkus.aws.credentials.type=static
%dev.quarkus.aws.credentials.static-provider.access-key-id=test
%dev.quarkus.aws.credentials.static-provider.secret-access-key=test

%dev.quarkus.dynamodb.aws.credentials.type=static
%dev.quarkus.dynamodb.aws.credentials.static-provider.access-key-id=test
%dev.quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=test

%dev.quarkus.s3.aws.credentials.type=static
%dev.quarkus.s3.aws.credentials.static-provider.access-key-id=test
%dev.quarkus.s3.aws.credentials.static-provider.secret-access-key=test

%dev.quarkus.sqs.aws.credentials.type=static
%dev.quarkus.sqs.aws.credentials.static-provider.access-key-id=test
%dev.quarkus.sqs.aws.credentials.static-provider.secret-access-key=test

%dev.quarkus.dynamodb.endpoint-override=http://localhost:4566
%dev.quarkus.s3.endpoint-override=http://localhost:4566
%dev.quarkus.sqs.endpoint-override=http://localhost:4566
