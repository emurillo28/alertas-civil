# =============================================================================
# PROD PROFILE - Production Configuration
# =============================================================================
# Activated via: mvn -Dquarkus.profile=prod package
# Or: QUARKUS_PROFILE=prod java -jar target/quarkus-app/quarkus-run.jar

# ─── DynamoDB Production Settings ────────────────────────────────────────────
# Use AWS SDK defaults (IAM roles, instance profile, env vars)
# Endpoint override should NOT be set in prod (uses actual AWS DynamoDB)
# quarkus.dynamodb.endpoint-override=  # Intentionally blank for AWS

# Optimistic: use adaptive retry mode for production
quarkus.dynamodb.client.adaptive-retry=true
quarkus.dynamodb.client.max-concurrency=100
quarkus.dynamodb.client.connection-max-idle-time=60s
quarkus.dynamodb.client.connection-timeout=2s
quarkus.dynamodb.client.api-call-timeout=10s
quarkus.dynamodb.client.api-call-attempt-timeout=5s

# ─── S3 Production Settings ──────────────────────────────────────────────────
# quarkus.s3.endpoint-override=  # Intentionally blank for AWS S3
quarkus.s3.aws.region=${AWS_REGION:us-east-1}
quarkus.s3.path-style-access=false

# ─── SQS Production Settings ─────────────────────────────────────────────────
# quarkus.sqs.endpoint-override=  # Intentionally blank for AWS SQS
quarkus.sqs.aws.region=${AWS_REGION:us-east-1}

# ─── Table Name ──────────────────────────────────────────────────────────────
app.dynamodb.table-name=${DYNAMODB_TABLE_NAME:hc-alertas}

# ─── S3 Bucket Name ──────────────────────────────────────────────────────────
# Injected via Terraform at Lambda deployment time
app.s3.bucket-name=${S3_BUCKET_NAME:hc-alertas-clinical-docs}

# ─── SQS Queue URL ───────────────────────────────────────────────────────────
# Injected via Terraform at Lambda deployment time
app.sqs.notification-queue-url=${SQS_NOTIFICATION_QUEUE_URL}

# ─── Logging - JSON format for CloudWatch Logs Insights ──────────────────────
quarkus.log.console.json=true
quarkus.log.console.json.pretty-print=false
quarkus.log.console.format=%m%n
quarkus.log.level=INFO
quarkus.log.category."com.hospital.alertas".level=INFO
quarkus.log.category."software.amazon.awssdk".level=WARN
quarkus.log.category."io.quarkus".level=WARN
quarkus.log.category."org.hibernate".level=WARN

# ─── Metrics (EMF for CloudWatch Embedded Metric Format) ─────────────────────
quarkus.smallrye-metrics.enabled=true
quarkus.smallrye-metrics.path=/metrics

# ─── Health Checks (for ALB/Load Balancer) ───────────────────────────────────
quarkus.smallrye-health.enabled=true
quarkus.smallrye-health.root-path=/health
quarkus.smallrye-health.ui.enable=false

# ─── OpenAPI/Swagger (disabled in prod for attack surface reduction) ─────────
quarkus.smallrye-openapi.enabled=false

# ─── Dev Services Disabled in Production ─────────────────────────────────────
quarkus.dynamodb.devservices.enabled=false
quarkus.amazonservices.devservices.enabled=false
quarkus.devservices.enabled=false

# ─── Native Image Optimizations ──────────────────────────────────────────────
quarkus.native.additional-build-args=-H:+OptimizeSpaces,-H:+RegisterForReflection,-H:EnableUnsafeMemoryAccess,-H:+RemoveSaturatedTypeFlows

# ─── Lambda Cold Start Optimization ──────────────────────────────────────────
# Enable class initialization at build time
quarkus.native.additional-build-args=--initialize-at-build-time=com.hospital.alertas
# Report unsupported elements at build time
quarkus.native.additional-build-args=--report-unsupported-elements-at-runtime

# ─── SSL/TLS (enforced in prod) ──────────────────────────────────────────────
quarkus.dynamodb.client.ssl.enabled=true
quarkus.s3.client.ssl.enabled=true
quarkus.sqs.client.ssl.enabled=true