# =============================================================================
# TEST PROFILE - Quarkus Dev Services & Testcontainers Configuration
# =============================================================================
# Pinned to LocalStack 3.4.0 to avoid Pro license activation (exit code 55)
# This MUST match infra/docker-compose.yml image tag

# ─── DynamoDB Dev Services ──────────────────────────────────────────────────
quarkus.dynamodb.devservices.enabled=true
quarkus.dynamodb.devservices.image-name=localstack/localstack:3.4.0
quarkus.dynamodb.devservices.container-env.SERVICES=dynamodb,s3,sqs
quarkus.dynamodb.devservices.container-env.DEFAULT_REGION=us-east-1
quarkus.dynamodb.devservices.container-env.AWS_DEFAULT_REGION=us-east-1
quarkus.dynamodb.devservices.port=4566
quarkus.dynamodb.devservices.init-timeout=120s
quarkus.dynamodb.devservices.startup-timeout=120s

# ─── Amazon Services Dev Services (shared LocalStack for SQS/S3) ─────────────
quarkus.amazonservices.devservices.enabled=true
quarkus.amazonservices.devservices.image-name=localstack/localstack:3.4.0
quarkus.amazonservices.devservices.shared=true
quarkus.amazonservices.devservices.container-env.SERVICES=dynamodb,s3,sqs
quarkus.amazonservices.devservices.container-env.DEFAULT_REGION=us-east-1

# ─── DynamoDB Client (point to Dev Services) ─────────────────────────────────
quarkus.dynamodb.endpoint-override=${quarkus.dynamodb.devservices.url}
quarkus.dynamodb.aws.region=us-east-1
# Disable checksum calculations for LocalStack compatibility
quarkus.dynamodb.client.checksum-validation=false

# ─── S3 Client (point to Dev Services) ───────────────────────────────────────
quarkus.s3.endpoint-override=${quarkus.dynamodb.devservices.url}
quarkus.s3.aws.region=us-east-1
quarkus.s3.path-style-access=true

# ─── Table Name ──────────────────────────────────────────────────────────────
app.dynamodb.table-name=hc-alertas-test

# ─── Logging for Tests ───────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n
quarkus.log.category."com.hospital.alertas".level=DEBUG
quarkus.log.category."software.amazon.awssdk".level=WARN

# ─── Test-specific Settings ──────────────────────────────────────────────────
# Disable SSL for local testing
quarkus.dynamodb.client.ssl.enabled=false
quarkus.s3.client.ssl.enabled=false

# ─── Disable Dev UI in Tests ─────────────────────────────────────────────────
quarkus.devservices.enabled=true
quarkus.launch.devmode=false